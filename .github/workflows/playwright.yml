name: Playwright Tests & CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  # 🌙 Nightly Cron: හැමදාම රෑ 12ට Automated විදිහට Run වෙන්න
  schedule:
    - cron: '0 0 * * *'

jobs:
  test:
    runs-on: ubuntu-latest
    
    # 💡 අවසර දීම (GitHub Pages වලට report එක publish කරන්න)
    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 18

    - name: Install Dependencies
      run: npm ci

    - name: Install Playwright Browsers & Dependencies
      run: npx playwright install --with-deps

    - name: Run Playwright Tests
      run: xvfb-run npx playwright test
      continue-on-error: true # Tests fail වුණත් report එක deploy වෙන්න 

    - name: Upload HTML Test Report Artifact
      uses: actions/upload-artifact@v4
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30

    - name: Publish Test Report to GitHub Pages
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: playwright-report
        destination_dir: report